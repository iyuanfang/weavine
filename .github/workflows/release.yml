name: Build & Release (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies (sccache)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: windows-cargo
          cache-on-failure: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Windows NSIS)
        id: build
        # Use NSIS instead of MSI: Tauri's WiX-based MSI bundling fails on
        # windows-latest because the bundled WiX tools (light.exe) are often
        # blocked by Windows Defender or fail to download completely.
        # NSIS produces .exe installers that work the same way.
        run: |
          pnpm exec tauri build --bundles nsis 2>&1 | tee tauri-build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload build log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: weavine-windows-nsis
          path: target/release/bundle/nsis/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        run: |
          sudo apt-get install -y -qq sccache
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          mkdir -p ~/.cache/sccache

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Cargo dependencies (sccache)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: linux-cargo
          cache-on-failure: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Linux)
        id: build
        run: |
          pnpm exec tauri build --bundles deb 2>&1 | tee tauri-build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-linux
          path: tauri-build.log

      - name: Stage Linux bundle artifacts
        if: always() && steps.build.outcome == 'success'
        run: |
          echo "Bundle directory tree:"
          find target/release/bundle -maxdepth 4 -type f || true
          mkdir -p linux-out
          # Use xargs so empty result is not an error
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 2>/dev/null \
            | xargs -0 -r -I {} cp -v {} linux-out/ 2>&1 || echo "No .deb or .AppImage files found to stage"
          echo "Staged artifacts:"
          ls -la linux-out/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weavine-linux
          path: linux-out/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies (sccache)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: macos-cargo
          cache-on-failure: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (macOS DMG)
        id: build
        run: |
          pnpm exec tauri build 2>&1 | tee tauri-build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-macos
          path: tauri-build.log

      - name: Stage macOS bundle artifacts
        if: always() && steps.build.outcome == 'success'
        run: |
          echo "Bundle directory tree:"
          find target/release/bundle -maxdepth 4 -type f || true
          mkdir -p macos-out
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) -print0 2>/dev/null \
            | xargs -0 -r -I {} cp -rv {} macos-out/ 2>&1 || echo "No .dmg or .app files found to stage"
          echo "Staged artifacts:"
          ls -la macos-out/ || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weavine-macos
          path: macos-out/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust toolchain (stable) with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: android-cargo
          cache-on-failure: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate Android project
        run: cargo tauri android init

      - name: Inject frontendDist assets into Gradle config
        # src-tauri/gen/android/ is gitignored, so we patch build.gradle.kts
        # on every CI run. Without this, the web-spa dist/ never gets
        # bundled into the APK and the WebView opens to a blank white screen.
        # base64 payload decodes to the sourceSets override line below.
        run: |
          echo CmFuZHJvaWQuc291cmNlU2V0c1sibWFpbiJdLmFzc2V0cy5zcmNEaXJzKCJzcmMvbWFpbi9hc3NldHMiLCAiLi4vLi4vLi4vLi4vYXBwcy93ZWItc3BhL2Rpc3QiKQo= \
            | base64 -d >> src-tauri/gen/android/app/build.gradle.kts
          echo "=== last 5 lines of patched build.gradle.kts ==="
          tail -5 src-tauri/gen/android/app/build.gradle.kts

      - name: Build Tauri Android APK
        id: build
        run: |
          # Build from inside src-tauri/gen/android so the gradle wrapper's
          # working directory matches its location and outputs land in the
          # expected src-tauri/gen/android/app/build/outputs/apk/ tree.
          cd src-tauri/gen/android && ./gradlew assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/tauri-android-build.log"
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload build log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-build-log
          path: tauri-android-build.log

      - name: Stage Android APK
        if: always() && steps.build.outcome == 'success'
        run: |
          # Run staging in a script so exit codes propagate. The previous
          # `{ ...; } 2>&1 | tee` subshell lost exit codes from inside the
          # group, causing silent failures when find returned no matches.
          set -euo pipefail
          set -x
          mkdir -p android-out ~/.android
          echo "=== PWD ==="
          pwd
          echo "=== APK output dir listing ==="
          ls -laR src-tauri/gen/android/app/build/outputs/apk/ 2>&1 | head -80 || true
          echo "=== anywhere under app/build ==="
          find src-tauri/gen/android/app/build -name '*.apk' 2>&1 | head -20 || true
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating debug.keystore"
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -2
          fi
          UNSIGNED=$(find src-tauri/gen/android/app/build -name '*-release-unsigned.apk' 2>/dev/null | head -1)
          if [ -n "$UNSIGNED" ]; then
            echo "Signing $UNSIGNED with debug keystore"
            BT="$ANDROID_HOME/build-tools/34.0.0"
            "$BT/zipalign" -p -f 4 "$UNSIGNED" android-out/app-unsigned-aligned.apk
            "$BT/apksigner" sign \
              --ks ~/.android/debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out android-out/Weavine_universal-release.apk \
              android-out/app-unsigned-aligned.apk
            "$BT/apksigner" verify android-out/Weavine_universal-release.apk && echo "Signature verified OK"
            rm android-out/app-unsigned-aligned.apk
          else
            echo "No -release-unsigned.apk found; falling back to any *-release.apk"
            mapfile -t FOUND_APKS < <(find src-tauri/gen/android/app/build -name '*-release.apk' 2>/dev/null)
            if [ ${#FOUND_APKS[@]} -eq 0 ]; then
              mapfile -t FOUND_APKS < <(find src-tauri/gen/android/app/build -name '*.apk' 2>/dev/null)
            fi
            if [ ${#FOUND_APKS[@]} -eq 0 ]; then
              echo "ERROR: no APKs found anywhere under src-tauri/gen/android/app/build"
              echo "Contents of src-tauri/gen/android/app/build:"
              ls -laR src-tauri/gen/android/app/build 2>&1 | head -60 || true
              exit 1
            fi
            echo "Found ${#FOUND_APKS[@]} APK(s) to copy:"
            printf '  %s\n' "${FOUND_APKS[@]}"
            for apk in "${FOUND_APKS[@]}"; do
              cp -v "$apk" android-out/
              case "$apk" in
                *-release.apk)
                  echo "Re-signing $apk with CI debug keystore for consistency"
                  BT="$ANDROID_HOME/build-tools/34.0.0"
                  name=$(basename "$apk")
                  mv "android-out/$name" "android-out/$name.unsigned"
                  "$BT/zipalign" -p -f 4 "android-out/$name.unsigned" "android-out/$name.aligned"
                  "$BT/apksigner" sign \
                    --ks ~/.android/debug.keystore \
                    --ks-pass pass:android \
                    --ks-key-alias androiddebugkey \
                    --key-pass pass:android \
                    --out "android-out/$name" \
                    "android-out/$name.aligned"
                  rm "android-out/$name.unsigned" "android-out/$name.aligned"
                  ;;
              esac
            done
          fi
          echo "Staged APKs:"
          ls -la android-out/

      - name: Upload Android stage log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-stage-log
          path: android-stage.log

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: weavine-android
          path: android-out/*.apk
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts/ -type f

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows NSIS installer to Release
        run: |
          find artifacts/weavine-windows-nsis -type f -name '*.exe' -print0 | \
            xargs -0 gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Linux artifacts to Release
        run: |
          # actions/upload-artifact@v4 preserves relative paths
          find artifacts/weavine-linux -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | \
            xargs -0 gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload macOS artifacts to Release
        run: |
          find artifacts/weavine-macos -type f \( -name '*.dmg' -o -name '*.app' \) -print0 | \
            xargs -0 gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Android APK to Release
        run: |
          find artifacts/weavine-android -type f -name '*.apk' -print0 | \
            xargs -0 gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber
        env:
          GH_TOKEN: ${{ github.token }}
