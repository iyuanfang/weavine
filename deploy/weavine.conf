upstream weavine_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name www.weavine.com weavine.com;
    access_log /var/log/nginx/weavine.access.log;
    error_log  /var/log/nginx/weavine.error.log;
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.weavine.com weavine.com;
    ssl_certificate     /home/ubuntu/certs/www.weavine.com.fullchain.cer;
    ssl_certificate_key /home/ubuntu/certs/www.weavine.com.key;
    access_log /var/log/nginx/weavine.access.log;
    error_log  /var/log/nginx/weavine.error.log;
    client_max_body_size 25m;

    # ── Marketing landing at / ─────────────────────────────
    root /home/ubuntu/weavine/apps/landing/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SPA: known client-side routes ──────────────────────
    # The web app lives at the domain root (base '/'), so its routes must be
    # carved out explicitly and served from web-spa/dist with SPA fallback.
    # @spa serves index.html from the filesystem directly — a plain
    # "try_files $uri /index.html" would internally redirect to /index.html,
    # re-match location / and return the landing page instead.
    location @spa {
        root /home/ubuntu/weavine/apps/web-spa/dist;
        try_files /index.html =404;
    }

    location ~ ^/(today|login|forgot-password|reset-password|contacts|notes|calendar|actions|projects|archive|settings|tags|search|graph|md-editor)(/|$) {
        root /home/ubuntu/weavine/apps/web-spa/dist;
        try_files $uri @spa;
    }

    # SPA hashed assets + public files (base '/')
    location /spa/ {
        root /home/ubuntu/weavine/apps/web-spa/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /manifest.json {
        root /home/ubuntu/weavine/apps/web-spa/dist;
    }
    location = /logo.svg {
        root /home/ubuntu/weavine/apps/web-spa/dist;
    }
    location = /sw.js {
        root /home/ubuntu/weavine/apps/web-spa/dist;
    }

    # ── Self-hosted release downloads ──────────────────────
    location /downloads/ {
        alias /home/ubuntu/weavine/www-downloads/;
        autoindex off;
    }

    # ── API + media ────────────────────────────────────────
    location /api/ {
        proxy_pass http://weavine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location /files/ {
        proxy_pass http://weavine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
