[workspace]
resolver = "2"
members = ["src-tauri", "server", "weavine-mcp"]

# whisper-rs-sys is vendored without its bindgen build-dependency. Stock
# whisper-rs-sys pulls clang-sys 1.x via bindgen 0.71, which conflicts with
# leptess's bindgen 0.49 -> clang-sys 0.28 (both declare links = "clang").
[patch.crates-io]
sherpa-onnx-sys = { path = "src-tauri/vendor/sherpa-onnx-sys-1.13.5-android-layout-fix" }
