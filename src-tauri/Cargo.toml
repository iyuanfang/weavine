[package]
name = "weavine"
version = "1.0.20"
edition = "2021"
default-run = "weavine"
license = "AGPL-3.0"

[lib]
name = "weavine_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "weavine"
path = "src/main.rs"

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
bcrypt = "0.15"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
anyhow = "1"
regex = "1"
fuzzy-matcher = "0.3"
bzip2 = "0.5"
tar = "0.4"

# sqlx: optional — only activated when server crate depends with features= ["sqlx"]
# Provides FromRow derive for models without pulling in runtime deps.
sqlx = { version = "0.8", optional = true, default-features = false, features = ["macros", "derive", "postgres", "uuid", "chrono"] }

# On-device speech recognition on Android via sherpa-onnx (SenseVoice).
# The 230 MB model is downloaded on first voice use, not bundled in the APK.
# Build-script downloads sherpa-onnx's prebuilt static archive; no system
# ONNX Runtime required.
[target.'cfg(target_os = "android")'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
