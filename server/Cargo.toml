[package]
name = "weavine-server"
version = "1.0.1"
edition = "2021"
license = "AGPL-3.0"

[features]
default = ["ocr"]
ocr = ["dep:leptess"]

[dependencies]
weavine = { path = "../src-tauri", default-features = false, features = ["sqlx"] }
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower = "0.5"
bcrypt = "0.15"
jsonwebtoken = "9"
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
leptess = { version = "0.6", optional = true }
tempfile = "3"
